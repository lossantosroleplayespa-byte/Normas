<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Santos RP | Panel Administrativo</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --primary: #00d2ff; --card: #111111; --text: #ffffff; --accent: #ff0055; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; position: fixed; top: 0; width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 2px solid var(--primary); }
        .nav-brand { font-weight: 900; font-size: 22px; color: var(--primary); text-transform: uppercase; }
        
        .sidebar { position: fixed; top: 0; right: -100%; width: 300px; height: 100%; background: var(--card); z-index: 2000; transition: 0.5s; padding: 80px 30px; border-left: 2px solid var(--primary); }
        .sidebar.open { right: 0; }
        .sidebar-link { display: block; padding: 15px; color: #aaa; text-decoration: none; font-weight: 700; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .sidebar-link:hover { background: rgba(0,210,255,0.1); color: var(--primary); }

        .view { display: none; flex-direction: column; align-items: center; padding: 120px 20px; min-height: 100vh; box-sizing: border-box; }
        .view.active { display: flex; animation: slideUp 0.5s ease; }

        .accordion { width: 100%; max-width: 950px; margin-bottom: 15px; }
        .acc-header { background: var(--card); padding: 20px; cursor: pointer; border-radius: 12px; font-weight: 800; display: flex; justify-content: space-between; border: 1px solid rgba(255,255,255,0.1); }
        .acc-content { max-height: 0; overflow: hidden; transition: 0.5s ease; }
        .accordion.open .acc-content { max-height: 5000px; padding-top: 15px; }

        .ls-card { background: #1a1a1a; border-radius: 10px; padding: 20px; margin-bottom: 15px; border-left: 4px solid var(--primary); }
        .ls-card h3 { color: var(--primary); margin: 0 0 10px 0; }
        .ls-card p { font-size: 14px; opacity: 0.8; white-space: pre-line; line-height: 1.6; }
        .ls-card img { width: 100%; border-radius: 8px; margin-top: 15px; }

        .admin-box { width: 100%; max-width: 700px; background: var(--card); padding: 30px; border-radius: 15px; border-top: 4px solid var(--primary); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; background: #1a1a1a; border: 1px solid #333; color: white; box-sizing: border-box; }
        .btn { border: none; border-radius: 8px; color: white; padding: 12px 20px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .btn-ls { background: linear-gradient(45deg, #3a7bd5, var(--primary)); width: 100%; }
        
        .manage-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 14px; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; display: none; align-items: center; justify-content: center; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="header">
        <div id="cfg-nav-title" class="nav-brand">LOS SANTOS RP</div>
        <div style="cursor:pointer; font-size: 28px;" onclick="toggleSide()">☰</div>
    </header>

    <div id="sidebar" class="sidebar">
        <span style="float:right; cursor:pointer; font-size: 35px; color: var(--primary);" onclick="toggleSide()">×</span>
        <div class="sidebar-link" onclick="goTo('home')">INICIO</div>
        <div class="sidebar-link" onclick="goTo('norms')">NORMATIVAS</div>
        <div class="sidebar-link" onclick="openLogin()" style="color:var(--accent); margin-top:40px;">ADMIN PANEL</div>
    </div>

    <section id="view-home" class="view active">
        <img id="display-logo" src="" style="width:150px; height:150px; border-radius:50%; border: 3px solid var(--primary); margin-bottom:25px; display:none; object-fit: cover;">
        <h1 id="display-title" style="font-size: 3rem; font-weight: 900; margin: 0;">LOS SANTOS RP</h1>
        <p id="display-desc" style="opacity: 0.6;">Portal de Normativas</p>
    </section>

    <section id="view-norms" class="view">
        <h2 style="color: var(--primary); margin-bottom:30px;">REGLAMENTO INTERNO</h2>
        <div id="render-norms" style="width:100%; max-width:950px;"></div>
    </section>

    <section id="view-admin" class="view">
        <div style="display:flex; gap:10px; margin-bottom:20px; overflow-x: auto; width: 100%; justify-content: center; padding: 10px;">
            <button class="btn" style="background:#333" onclick="tab('t-post')">Publicar</button>
            <button class="btn" style="background:#333" onclick="tab('t-manage')">Lista / Categorías</button>
            <button class="btn" style="background:#333" onclick="tab('t-settings')">Ajustes</button>
            <button class="btn" style="background:var(--accent)" onclick="logout()">Salir</button>
        </div>

        <div id="t-post" class="admin-box">
            <h3 id="form-h">Nueva Norma</h3>
            <input type="text" id="p-cat" placeholder="Categoría (Ej: Normas Civiles)">
            <input type="text" id="p-tit" placeholder="Título / Subcategoría (Ej: 1.1 RDM)">
            <textarea id="p-desc" rows="5" placeholder="Descripción de la norma..."></textarea>
            <input type="text" id="p-img" placeholder="URL Imagen (Opcional)">
            <button id="btn-main" class="btn btn-ls" onclick="handlePost()">Guardar Norma</button>
            <button id="btn-cancel" class="btn" style="background:#444; width:100%; margin-top:10px; display:none;" onclick="resetForm()">Cancelar</button>
        </div>

        <div id="t-manage" class="admin-box" style="display:none">
            <h3 style="color:var(--primary)">Borrar Categorías Completas</h3>
            <div id="category-list" style="margin-bottom:30px;"></div>
            
            <h3 style="color:var(--primary)">Gestión de Normas Individuales</h3>
            <div id="admin-list"></div>
        </div>

        <div id="t-settings" class="admin-box" style="display:none">
            <h3>Ajustes Generales</h3>
            <input id="c-name" placeholder="Nombre Servidor">
            <input id="c-desc" placeholder="Descripción">
            <input id="c-logo" placeholder="URL Logo">
            <input type="password" id="c-pass" placeholder="Nueva Clave Admin">
            <button class="btn btn-ls" onclick="saveConfig()">Guardar Cambios</button>
        </div>
    </section>

    <div id="login" class="overlay">
        <div class="admin-box" style="max-width:320px; text-align:center;">
            <h2>STAFF LOGIN</h2>
            <input type="password" id="st-p" placeholder="Contraseña">
            <button class="btn btn-ls" onclick="checkLogin()">Entrar</button>
            <button class="btn" style="background:none; margin-top:10px;" onclick="document.getElementById('login').style.display='none'">Cerrar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDdcVV-trnP7VE70kYw7kqZmpTJ3ISceTc",
          authDomain: "los-santos-rp-5a0a8.firebaseapp.com",
          databaseURL: "https://los-santos-rp-5a0a8-default-rtdb.firebaseio.com",
          projectId: "los-santos-rp-5a0a8",
          storageBucket: "los-santos-rp-5a0a8.firebasestorage.app",
          messagingSenderId: "147687871298",
          appId: "1:147687871298:web:ade52e2dce1f1492436edb"
        };
        firebase.initializeApp(firebaseConfig);
        const fb = firebase.database();

        let data = { config: {}, posts: {} };
        let currentEditId = null;

        fb.ref('/').on('value', snap => { if(snap.val()){ data = snap.val(); render(); }});

        function render() {
            const cfg = data.config || {};
            document.getElementById('cfg-nav-title').innerText = cfg.name || "LOS SANTOS RP";
            document.getElementById('display-title').innerText = cfg.name || "LOS SANTOS RP";
            document.getElementById('display-desc').innerText = cfg.desc || "Portal de Normativas";
            if(cfg.logo) { document.getElementById('display-logo').src = cfg.logo; document.getElementById('display-logo').style.display = 'block'; }

            const vNorms = document.getElementById('render-norms'), aList = document.getElementById('admin-list'), cList = document.getElementById('category-list');
            vNorms.innerHTML = ""; aList.innerHTML = ""; cList.innerHTML = "";
            const groups = {};
            const posts = data.posts || {};

            for(let id in posts) {
                const p = posts[id];
                if(!groups[p.cat]) groups[p.cat] = [];
                groups[p.cat].push({...p, id});

                aList.innerHTML += `<div class="manage-item">
                    <span>[${p.cat}] <b>${p.title}</b></span>
                    <div>
                        <button onclick="setupEdit('${id}')" style="color:var(--primary); background:none; border:none; cursor:pointer; font-weight:bold;">EDITAR</button>
                        <button onclick="delPost('${id}')" style="color:var(--accent); background:none; border:none; cursor:pointer; font-weight:bold; margin-left:10px;">BORRAR</button>
                    </div>
                </div>`;
            }

            for(let cat in groups) {
                // Render en vista pública
                let cards = groups[cat].map(i => `<div class="ls-card"><h3>${i.title}</h3><p>${i.desc}</p>${i.img ? `<img src="${i.img}">` : ''}</div>`).join('');
                vNorms.innerHTML += `<div class="accordion"><div class="acc-header" onclick="this.parentElement.classList.toggle('open')">${cat.toUpperCase()} <span>▼</span></div><div class="acc-content">${cards}</div></div>`;
                
                // Render en lista de categorías del admin
                cList.innerHTML += `<div class="manage-item" style="border-left: 4px solid var(--accent)">
                    <b style="color:var(--accent)">CATEGORÍA: ${cat.toUpperCase()}</b>
                    <button onclick="delCategory('${cat}')" style="background:var(--accent); color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-size:10px;">ELIMINAR TODO</button>
                </div>`;
            }
        }

        function handlePost() {
            const cat = document.getElementById('p-cat').value, title = document.getElementById('p-tit').value, desc = document.getElementById('p-desc').value, img = document.getElementById('p-img').value;
            if(!cat || !title || !desc) return alert("Completa los campos obligatorios");
            if(currentEditId) fb.ref(`posts/${currentEditId}`).update({cat, title, desc, img});
            else fb.ref('posts').push({cat, title, desc, img});
            resetForm();
            alert("Operación exitosa");
        }

        function setupEdit(id) {
            const p = data.posts[id]; currentEditId = id; tab('t-post');
            document.getElementById('form-h').innerText = "Editando Norma";
            document.getElementById('p-cat').value = p.cat; document.getElementById('p-tit').value = p.title;
            document.getElementById('p-desc').value = p.desc; document.getElementById('p-img').value = p.img || "";
            document.getElementById('btn-cancel').style.display = "block";
        }

        function delCategory(catName) {
            if(confirm(`¿Estás SEGURO? Se borrarán TODAS las normas dentro de "${catName.toUpperCase()}".`)) {
                const posts = data.posts || {};
                for(let id in posts) {
                    if(posts[id].cat === catName) fb.ref(`posts/${id}`).remove();
                }
            }
        }

        function resetForm() { currentEditId = null; document.getElementById('form-h').innerText = "Nueva Norma"; document.querySelectorAll('#t-post input, #t-post textarea').forEach(i => i.value=""); document.getElementById('btn-cancel').style.display = "none"; }
        function delPost(id) { if(confirm("¿Borrar esta norma?")) fb.ref(`posts/${id}`).remove(); }
        function saveConfig() { 
            const up = { name: document.getElementById('c-name').value, desc: document.getElementById('c-desc').value, logo: document.getElementById('c-logo').value };
            if(document.getElementById('c-pass').value) up.pass = document.getElementById('c-pass').value;
            fb.ref('config').update(up); alert("Configuración guardada");
        }

        function checkLogin() {
            if(document.getElementById('st-p').value === (data.config.pass || "Pampigod")) {
                document.getElementById('login').style.display = 'none'; goTo('admin');
            } else alert("Clave Incorrecta");
        }

        function logout() { goTo('home'); document.getElementById('st-p').value = ""; }
        function openLogin() { document.getElementById('login').style.display='flex'; toggleSide(); }
        function toggleSide() { document.getElementById('sidebar').classList.toggle('open'); }
        function goTo(id) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById('view-'+id).classList.add('active'); }
        function tab(id) { ['t-post','t-manage','t-settings'].forEach(t => document.getElementById(t).style.display = 'none'); document.getElementById(id).style.display = 'block'; }
    </script>
</body>
</html>
