<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los Santos RP | Portal de Normativas</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --primary: #00d2ff; --card: #111111; --text: #ffffff; --accent: #ff0055; --edit: #2563eb; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* NAVEGACIÓN */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; position: fixed; top: 0; width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px); z-index: 1000; border-bottom: 2px solid var(--primary); }
        .nav-brand { font-weight: 900; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; color: var(--primary); }
        
        .sidebar { position: fixed; top: 0; right: -100%; width: 300px; height: 100%; background: var(--card); z-index: 2000; transition: 0.5s; padding: 80px 30px; border-left: 2px solid var(--primary); }
        .sidebar.open { right: 0; }
        .sidebar-link { display: block; padding: 15px; color: #aaa; text-decoration: none; font-weight: 700; font-size: 18px; transition: 0.3s; border-radius: 8px; margin-bottom: 10px; cursor: pointer; }
        .sidebar-link:hover { background: rgba(0,210,255,0.1); color: var(--primary); }

        /* VISTAS */
        .view { display: none; flex-direction: column; align-items: center; padding: 120px 20px; min-height: 100vh; box-sizing: border-box; }
        .view.active { display: flex; animation: slideUp 0.5s ease; }

        /* TARJETAS DE NORMAS */
        .content-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; width: 100%; padding: 10px; }
        .ls-card { background: var(--card); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); padding: 20px; transition: 0.3s; }
        .ls-card:hover { border-color: var(--primary); box-shadow: 0 10px 30px rgba(0,210,255,0.2); }
        .ls-card h3 { color: var(--primary); margin: 0 0 10px 0; font-size: 18px; }
        .ls-card p { font-size: 14px; opacity: 0.8; line-height: 1.6; white-space: pre-line; }
        .ls-card img { width: 100%; border-radius: 8px; margin-top: 15px; max-height: 250px; object-fit: cover; }

        /* ACORDEONES */
        .accordion { width: 100%; max-width: 950px; margin-bottom: 15px; }
        .acc-header { background: var(--card); padding: 20px; cursor: pointer; border-radius: 12px; font-weight: 800; display: flex; justify-content: space-between; border: 1px solid rgba(255,255,255,0.1); }
        .acc-content { max-height: 0; overflow: hidden; transition: 0.5s ease; }
        .accordion.open .acc-content { max-height: 20000px; padding-top: 15px; }

        /* ADMIN PANEL */
        .admin-box { width: 100%; max-width: 700px; background: var(--card); padding: 30px; border-radius: 15px; border-top: 4px solid var(--primary); }
        input, textarea, select { width: 100%; padding: 14px; margin: 10px 0; border-radius: 8px; background: #1a1a1a; border: 1px solid #333; color: white; font-family: inherit; }
        .btn { border: none; border-radius: 8px; color: white; padding: 14px 25px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-ls { background: linear-gradient(45deg, #3a7bd5, var(--primary)); }
        
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 3000; display: none; align-items: center; justify-content: center; flex-direction: column; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header class="header">
        <div id="cfg-nav-title" class="nav-brand">LOS SANTOS RP</div>
        <div style="cursor:pointer; font-size: 28px;" onclick="toggleSide()">☰</div>
    </header>

    <div id="sidebar" class="sidebar">
        <span style="float:right; cursor:pointer; font-size: 35px; color: var(--primary);" onclick="toggleSide()">×</span>
        <div class="sidebar-link" onclick="goTo('home')">INICIO</div>
        <div class="sidebar-link" onclick="goTo('norms')">NORMATIVAS</div>
        <div class="sidebar-link" onclick="openLogin()" style="color:var(--accent); margin-top:40px; border-top: 1px solid #333;">ADMIN PANEL</div>
    </div>

    <section id="view-home" class="view active">
        <img id="display-logo" src="" style="width:150px; height:150px; border-radius:50%; border: 3px solid var(--primary); margin-bottom:25px; display:none; object-fit: cover;">
        <h1 id="display-title" style="font-size: 3.5rem; font-weight: 900; margin: 0; text-shadow: 0 0 20px rgba(0,210,255,0.5);">LOS SANTOS RP</h1>
        <p id="display-desc" style="font-size: 1.2rem; opacity: 0.6; margin-top: 10px;">Cargando información...</p>
        <div style="margin: 40px 0; width: 100%; max-width: 500px;"><input type="text" style="background: rgba(255,255,255,0.05);" placeholder="Buscar normativa..." onkeyup="globalSearch(this.value)"></div>
        <button class="btn btn-ls" onclick="goTo('norms')">Ver Reglamento</button>
    </section>

    <section id="view-norms" class="view">
        <h2 style="font-size: 2.5rem; color: var(--primary); margin-bottom:30px;">REGLAMENTO INTERNO</h2>
        <div id="render-norms" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    </section>

    <section id="view-admin" class="view">
        <div id="staff-info-bar" style="background:var(--primary); color:black; padding:10px 30px; border-radius:5px; font-weight:900; margin-bottom:30px;"></div>
        <div style="display:flex; gap:10px; margin-bottom:30px; overflow-x:auto; padding: 10px; width: 100%; justify-content:center;">
            <button class="btn btn-ls" onclick="tab('t-post')">Publicar/Editar</button>
            <button class="btn" style="background:#333" onclick="tab('t-manage')">Lista de Normas</button>
            <button class="btn" style="background:#111; border:1px solid #444" onclick="tab('t-settings')">Ajustes Web</button>
            <button class="btn" style="background:var(--accent)" onclick="location.reload()">Salir</button>
        </div>

        <div id="t-post" class="admin-box">
            <h3 id="form-header">Nueva Norma / Artículo</h3>
            <input type="text" id="p-cat" placeholder="Categoría (Ej: Normas Civiles)">
            <input type="text" id="p-tit" placeholder="Título (Ej: Art. 1 - RDM)">
            <textarea id="p-desc" rows="6" placeholder="Escribe aquí el reglamento..."></textarea>
            <input type="text" id="p-img" placeholder="URL de Imagen (Opcional)">
            <button id="btn-main" class="btn btn-ls" style="width:100%" onclick="handlePost()">Publicar Norma</button>
            <button id="btn-cancel" class="btn" style="width:100%; margin-top:10px; background:#444; display:none;" onclick="resetForm()">Cancelar Edición</button>
        </div>

        <div id="t-manage" class="admin-box" style="display:none">
            <h3>Gestor de Normativas</h3>
            <div id="admin-list"></div>
        </div>

        <div id="t-settings" class="admin-box" style="display:none">
            <h3>Configuración del Portal</h3>
            <label>Nombre Servidor:</label><input id="c-name">
            <label>Descripción Inicio:</label><input id="c-desc">
            <label>URL Logo (PNG):</label><input id="c-logo">
            <hr style="border:0; border-top:1px solid #333; margin:20px 0;">
            <label>Webhook Discord:</label><input id="c-hook">
            <label>Clave Admin Maestra:</label><input type="password" id="c-pass" placeholder="Nueva clave">
            <button class="btn btn-ls" style="width:100%" onclick="saveConfig()">Guardar Cambios</button>
        </div>
    </section>

    <div id="login" class="overlay">
        <div class="admin-box" style="max-width:320px; text-align:center;">
            <h2 style="color:var(--primary)">STAFF ACCESS</h2>
            <input type="text" id="st-n" placeholder="Nombre">
            <input type="text" id="st-r" placeholder="Rango">
            <input type="password" id="st-p" placeholder="Contraseña">
            <button class="btn btn-ls" style="width:100%; margin-top:15px;" onclick="checkLogin()">Acceder</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE TU NUEVA NUBE (LOS SANTOS RP)
        const firebaseConfig = {
          apiKey: "AIzaSyDdcVV-trnP7VE70kYw7kqZmpTJ3ISceTc",
          authDomain: "los-santos-rp-5a0a8.firebaseapp.com",
          databaseURL: "https://los-santos-rp-5a0a8-default-rtdb.firebaseio.com",
          projectId: "los-santos-rp-5a0a8",
          storageBucket: "los-santos-rp-5a0a8.firebasestorage.app",
          messagingSenderId: "147687871298",
          appId: "1:147687871298:web:ade52e2dce1f1492436edb",
          measurementId: "G-VVPCJ0LWY6"
        };
        
        firebase.initializeApp(firebaseConfig);
        const fb = firebase.database();

        let data = { config: {}, posts: {} };
        let user = { name: "", range: "" };
        let currentEditId = null;

        fb.ref('/').on('value', snap => {
            const val = snap.val();
            if(val) { data = val; render(); }
        });

        function render() {
            const cfg = data.config || {};
            document.getElementById('cfg-nav-title').innerText = cfg.name || "LOS SANTOS RP";
            document.getElementById('display-title').innerText = cfg.name || "LOS SANTOS RP";
            document.getElementById('display-desc').innerText = cfg.desc || "Portal de Normativas";
            if(cfg.logo) { 
                document.getElementById('display-logo').src = cfg.logo; 
                document.getElementById('display-logo').style.display = 'block'; 
            }

            const vNorms = document.getElementById('render-norms'), aList = document.getElementById('admin-list');
            vNorms.innerHTML = ""; aList.innerHTML = "";
            const groups = {};
            const posts = data.posts || {};

            for(let id in posts) {
                const p = posts[id];
                if(!groups[p.cat]) groups[p.cat] = [];
                groups[p.cat].push({...p, id});

                aList.innerHTML += `<div style="display:flex; justify-content:space-between; padding:12px; background:rgba(255,255,255,0.05); margin-bottom:8px; border-radius:8px; align-items:center;">
                    <span style="font-size:13px;">[${p.cat}] <b>${p.title}</b></span>
                    <div>
                        <button onclick="setupEdit('${id}')" style="color:var(--primary); background:none; border:none; cursor:pointer; font-weight:bold; margin-right:10px;">EDITAR</button>
                        <button onclick="delPost('${id}')" style="color:var(--accent); background:none; border:none; cursor:pointer; font-weight:bold;">BORRAR</button>
                    </div>
                </div>`;
            }

            for(let cat in groups) {
                let cards = `<div class="content-grid">` + groups[cat].map(i => `<div class="ls-card"><h3>${i.title}</h3><p>${i.desc}</p>${i.img ? `<img src="${i.img}">` : ''}</div>`).join('') + `</div>`;
                vNorms.innerHTML += `<div class="accordion"><div class="acc-header" onclick="this.parentElement.classList.toggle('open')">${cat.toUpperCase()} <span>▼</span></div><div class="acc-content">${cards}</div></div>`;
            }
        }

        function handlePost() {
            const cat = document.getElementById('p-cat').value, title = document.getElementById('p-tit').value, desc = document.getElementById('p-desc').value, img = document.getElementById('p-img').value;
            if(!cat || !title || !desc) return alert("Rellena todos los campos.");

            if(currentEditId) {
                fb.ref(`posts/${currentEditId}`).update({ cat, title, desc, img });
                sendLog("✏️ NORMA ACTUALIZADA", `**Staff:** ${user.name}\n**Título:** ${title}`);
                resetForm();
                alert("Norma actualizada correctamente");
            } else {
                fb.ref('posts').push({ cat, title, desc, img });
                sendLog("🆕 NUEVA NORMA", `**Staff:** ${user.name}\n**Título:** ${title}`);
                alert("Publicado con éxito");
                resetForm();
            }
        }

        function setupEdit(id) {
            const p = data.posts[id];
            currentEditId = id;
            tab('t-post');
            document.getElementById('form-header').innerText = "Editando Artículo";
            document.getElementById('btn-main').innerText = "Actualizar Norma";
            document.getElementById('btn-cancel').style.display = "block";
            document.getElementById('p-cat').value = p.cat;
            document.getElementById('p-tit').value = p.title;
            document.getElementById('p-desc').value = p.desc;
            document.getElementById('p-img').value = p.img || "";
        }

        function resetForm() {
            currentEditId = null;
            document.getElementById('form-header').innerText = "Nueva Norma / Artículo";
            document.getElementById('btn-main').innerText = "Publicar Norma";
            document.getElementById('btn-cancel').style.display = "none";
            document.getElementById('p-cat').value = ""; document.getElementById('p-tit').value = ""; document.getElementById('p-desc').value = ""; document.getElementById('p-img').value = "";
        }

        function delPost(id) { if(confirm("¿Eliminar definitivamente?")) fb.ref(`posts/${id}`).remove(); }

        function saveConfig() {
            const up = { name: document.getElementById('c-name').value, desc: document.getElementById('c-desc').value, logo: document.getElementById('c-logo').value, hook: document.getElementById('c-hook').value };
            if(document.getElementById('c-pass').value) up.pass = document.getElementById('c-pass').value;
            fb.ref('config').update(up);
            alert("Ajustes guardados");
        }

        function checkLogin() {
            if(document.getElementById('st-p').value === (data.config.pass || "Pampigod")) {
                user.name = document.getElementById('st-n').value; user.range = document.getElementById('st-r').value;
                document.getElementById('staff-info-bar').innerText = `OPERADOR: ${user.name} | ${user.range}`;
                document.getElementById('login').style.display = 'none'; goTo('admin');
            } else alert("Clave Incorrecta");
        }

        async function sendLog(t, d) {
            if(!data.config.hook) return;
            fetch(data.config.hook, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ embeds: [{ title: t, description: d, color: 52479, timestamp: new Date() }] })});
        }

        function toggleSide() { document.getElementById('sidebar').classList.toggle('open'); }
        function goTo(id) { document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); document.getElementById('view-'+id).classList.add('active'); if(document.getElementById('sidebar').classList.contains('open')) toggleSide(); }
        function tab(id) { ['t-post','t-manage','t-settings'].forEach(t => document.getElementById(t).style.display = 'none'); document.getElementById(id).style.display = 'block'; }
        function openLogin() { toggleSide(); document.getElementById('login').style.display='flex'; }
        
        function globalSearch(q) {
            if(q.length < 2) return; goTo('norms');
            document.querySelectorAll('.accordion').forEach(acc => {
                acc.style.display = acc.innerText.toLowerCase().includes(q.toLowerCase()) ? 'block' : 'none';
                if(acc.style.display === 'block') acc.classList.add('open');
            });
        }
    </script>
</body>
</html>
